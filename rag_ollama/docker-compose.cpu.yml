# =============================================================================
# Docker Compose: CPU-only + локальный Ollama (без NVIDIA GPU)
# =============================================================================
# Запуск: docker compose -f docker-compose.cpu.yml up -d
# или:    make up-build-cpu

services:
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: roop-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roop}
      POSTGRES_USER: ${POSTGRES_USER:-roop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roop}
    # No host port: Django reaches PostgreSQL as "postgres" on the internal
    # network.  For host access during development use docker-compose.dev-ports.yml.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roop} -d ${POSTGRES_DB:-roop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.5}
    container_name: roop-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      # Корпоративный корневой сертификат для `ollama pull` за MITM-прокси.
      # Каталог всегда существует; без OLLAMA_SSL_CERT_FILE ни на что не влияет.
      - ./certs:/certs:ro
    environment:
      # Tuned for a 16 GB machine — see README "Ollama resource limits".
      # Especially important on CPU: parallel requests multiply the KV cache.
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS:-1}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-5m}"
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-4096}"
      # Пустое значение = системный набор корневых сертификатов образа.
      SSL_CERT_FILE: "${OLLAMA_SSL_CERT_FILE:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,ollama,postgres,django}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --------------------------------------------------------------------------
  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.32.5}
    container_name: roop-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./certs:/certs:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling $${LLM_MODEL} and $${EMBED_MODEL}..."
        ollama pull "$${LLM_MODEL}"
        ollama pull "$${EMBED_MODEL}"
        echo "Models ready!"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - LLM_MODEL=${LLM_MODEL:-gemma3:4b}
      - EMBED_MODEL=${EMBED_MODEL:-bge-m3}
      - SSL_CERT_FILE=${OLLAMA_SSL_CERT_FILE:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,ollama,postgres,django}
    restart: "no"

  # --------------------------------------------------------------------------
  django:
    # Готовый образ из реестра: `make up-image-cpu` запускает без сборки.
    image: ${ROOP_IMAGE:-fgeeha/roop:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roop-django
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - media_data:/app/media
      - log_data:/app/logs
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_PERSIST_DIR=/app/chroma_data
      # Embedded ChromaDB requires a single process — scale with threads.
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@localhost}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  ollama_data:
  chroma_data:
  media_data:
  log_data:
