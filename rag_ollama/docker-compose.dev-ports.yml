# =============================================================================
# Docker Compose override: публикация PostgreSQL на host (ТОЛЬКО разработка)
# =============================================================================
# Штатные конфигурации намеренно не публикуют порт PostgreSQL — Django ходит
# в базу по имени сервиса внутри Docker network.
#
# Этот override нужен, только если требуется подключиться к базе с хоста
# (psql, GUI-клиент, дамп). Не используйте его на общедоступной машине:
# порт открывается на всех интерфейсах.
#
# Использование:
#   docker compose -f docker-compose.yml -f docker-compose.dev-ports.yml up -d
#   docker compose -f docker-compose.cpu.yml -f docker-compose.dev-ports.yml up -d
#
# Порт на хосте можно переопределить: POSTGRES_HOST_PORT=55432
# =============================================================================

services:
  postgres:
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
