[tool.poetry]
name = "roop"
version = "1.0.0"
description = "ROoP (Rag-Ollama-On-Premises) - Production-ready RAG system on Django for closed-circuit corporate use. 100% local, no clouds, no external APIs."
authors = ["nkolesnikov"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"

# Django
Django = "^5.1.4"
djangorestframework = "^3.15.2"
django-cors-headers = "^4.6.0"

# LLM & Embeddings
ollama = "^0.4.4"
httpx = "^0.28.0"

# Vector DB
chromadb = "^0.5.23"

# Document processing
pdfplumber = "^0.11.0"
python-magic = "^0.4.27"
chardet = "^5.2.0"

# Utils
python-dotenv = "^1.0.1"
gunicorn = "^23.0.0"
whitenoise = "^6.8.0"

# Markdown support
markdown = "^3.7"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
pytest = "^8.3.0"
pytest-django = "^4.9.0"
django-debug-toolbar = "^4.4.0"
ipython = "^8.29.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff linter config
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rag_project.settings"
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
