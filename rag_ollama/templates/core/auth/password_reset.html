{% extends "core/base.html" %}

{% block title %}Сброс пароля - ROoP{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">&#9670;</div>
            <h1>Сброс пароля</h1>
            <p class="auth-subtitle">Введите email для получения ссылки на сброс</p>
        </div>

        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" class="form-input"
                       placeholder="your@email.com" required autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Отправить ссылку</button>
        </form>

        <div class="auth-footer">
            <p><a href="{% url 'core:login' %}">Вернуться ко входу</a></p>
        </div>
    </div>
</div>
{% endblock %}
