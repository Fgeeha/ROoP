{% extends "core/base.html" %}

{% block title %}Пароль изменен - ROoP{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo" style="font-size: 3rem; color: var(--success)">&#10003;</div>
            <h1>Пароль изменен</h1>
        </div>

        <div class="auth-message">
            <p>Ваш пароль успешно изменен. Вы вошли в систему.</p>
        </div>

        <div class="auth-footer">
            <a href="{% url 'core:index' %}" class="btn btn-primary btn-block">Перейти в чат</a>
        </div>
    </div>
</div>
{% endblock %}
