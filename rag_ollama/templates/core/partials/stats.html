<div class="stats-container">
    <div class="stat-item">
        <span class="stat-label">Документы:</span>
        <span class="stat-value">{{ docs_count }}</span>
    </div>
    <div class="stat-item">
        <span class="stat-label">Фрагменты:</span>
        <span class="stat-value">{{ chunks_count }}</span>
    </div>
    <div class="stat-item">
        <span class="stat-label">Общий размер:</span>
        <span class="stat-value">{{ total_size }}</span>
    </div>
    <div class="stat-item">
        <span class="stat-label">Ollama:</span>
        <span class="stat-value status-{{ ollama_status }}">{{ ollama_status }}</span>
    </div>
</div>
