# =============================================================================
# Docker Compose: Ollama на УДАЛЁННОМ сервере (или Open WebUI)
# =============================================================================
# Только Django + PostgreSQL, без локального Ollama.
#
# Настройте .env:
#   - Прямой Ollama:  LLM_BACKEND=ollama + OLLAMA_URL=http://192.168.1.100:11434
#   - Open WebUI:     LLM_BACKEND=openwebui + OPENWEBUI_URL + OPENWEBUI_API_KEY
#
# Запуск: docker compose -f docker-compose.external.yml up -d
# или:    make up-external

services:
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: roop-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roop}
      POSTGRES_USER: ${POSTGRES_USER:-roop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roop}
    # No host port: Django reaches PostgreSQL as "postgres" on the internal
    # network.  For host access during development use docker-compose.dev-ports.yml.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roop} -d ${POSTGRES_DB:-roop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  django:
    # Готовый образ из реестра: `make up-image-external` запускает без сборки.
    image: ${ROOP_IMAGE:-fgeeha/roop:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roop-django
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - media_data:/app/media
      - log_data:/app/logs
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - CHROMA_PERSIST_DIR=/app/chroma_data
      # Embedded ChromaDB requires a single process — scale with threads.
      # (Ollama runs elsewhere in this mode, so no OLLAMA_* limits here.)
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-1}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-4}
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@localhost}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  chroma_data:
  media_data:
  log_data:
