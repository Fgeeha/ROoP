# =============================================================================
# ROoP Production: CPU-only + локальный Ollama (без NVIDIA GPU)
# =============================================================================
# Использует готовый образ из Docker Hub -- ничего собирать не нужно.
#
# Подготовка:
#   1. cp .env.example .env && nano .env
#   2. Смените SECRET_KEY, POSTGRES_PASSWORD, DJANGO_SUPERUSER_PASSWORD
#
# Запуск:
#   docker compose -f docker-compose.cpu.yml up -d

services:
  # --------------------------------------------------------------------------
  # PostgreSQL -- база данных
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: roop-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roop}
      POSTGRES_USER: ${POSTGRES_USER:-roop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roop}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roop} -d ${POSTGRES_DB:-roop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Ollama -- локальный LLM-сервер (CPU)
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: roop-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  # --------------------------------------------------------------------------
  # Автоматическая загрузка моделей при первом запуске
  # --------------------------------------------------------------------------
  ollama-pull:
    image: ollama/ollama:latest
    container_name: roop-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling models..."
        ollama pull mistral
        ollama pull nomic-embed-text
        echo "Models ready!"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # --------------------------------------------------------------------------
  # ROoP Django -- основное приложение
  # --------------------------------------------------------------------------
  django:
    image: fgeeha/roop:latest
    container_name: roop-django
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - media_data:/app/media
      - log_data:/app/logs
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_PERSIST_DIR=/app/chroma_data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  ollama_data:
  chroma_data:
  media_data:
  log_data:
