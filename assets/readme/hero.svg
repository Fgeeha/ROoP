<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">ROoP — Rag-Ollama-On-Premises</title>
  <desc id="hero-desc">Локальная RAG-система: загрузка документов, чанки и эмбеддинги, векторный поиск в ChromaDB и ответ Ollama со ссылками на источники — весь путь проходит внутри локального контура.</desc>

  <rect width="1200" height="400" rx="26" fill="#0B0D0E"/>

  <!-- Motif: the perimeter everything lives inside -->
  <g id="perimeter">
    <rect x="32" y="32" width="1136" height="336" rx="18"
          fill="none" stroke="#7DBFAE" stroke-opacity="0.45"
          stroke-width="1.5" stroke-dasharray="7 6"/>
    <rect x="64" y="20" width="222" height="24" fill="#0B0D0E"/>
    <text x="76" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#7DBFAE" letter-spacing="1.6">ЛОКАЛЬНЫЙ КОНТУР</text>
  </g>

  <g id="title-block">
    <text x="72" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#79828A" letter-spacing="2.4">ON-PREMISES RAG</text>

    <text x="72" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="88" font-weight="700" fill="#F2F0ED" letter-spacing="-1">ROoP</text>

    <text x="72" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#79828A">Rag-Ollama-On-Premises</text>

    <text x="72" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" fill="#F2F0ED">Спрашивайте свои документы</text>
    <text x="72" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="27" fill="#F2F0ED">на естественном языке.</text>

    <text x="72" y="350" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#7DBFAE">Ни один файл не покидает вашу сеть</text>
  </g>

  <g id="pipeline-column">
    <!-- 01 -->
    <rect x="752" y="64" width="368" height="52" rx="10" fill="#14181A" stroke="#262B2E" stroke-width="1"/>
    <text x="774" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#7DBFAE">01</text>
    <text x="812" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#F2F0ED">PDF · DOCX · DOC · TXT · MD</text>
    <path d="M936 116 L936 138 M930 132 L936 140 L942 132" fill="none" stroke="#3A4145" stroke-width="1.5"/>

    <!-- 02 -->
    <rect x="752" y="144" width="368" height="52" rx="10" fill="#14181A" stroke="#262B2E" stroke-width="1"/>
    <text x="774" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#7DBFAE">02</text>
    <text x="812" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#F2F0ED">Чанки и эмбеддинги</text>
    <path d="M936 196 L936 218 M930 212 L936 220 L942 212" fill="none" stroke="#3A4145" stroke-width="1.5"/>

    <!-- 03 -->
    <rect x="752" y="224" width="368" height="52" rx="10" fill="#14181A" stroke="#262B2E" stroke-width="1"/>
    <text x="774" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#7DBFAE">03</text>
    <text x="812" y="256" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#F2F0ED">ChromaDB · векторный поиск</text>
    <path d="M936 276 L936 298 M930 292 L936 300 L942 292" fill="none" stroke="#3A4145" stroke-width="1.5"/>

    <!-- 04 -->
    <rect x="752" y="304" width="368" height="52" rx="10" fill="#14181A" stroke="#262B2E" stroke-width="1"/>
    <text x="774" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" fill="#7DBFAE">04</text>
    <text x="812" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="20" fill="#F2F0ED">Ollama · ответ с источниками</text>
  </g>
</svg>
