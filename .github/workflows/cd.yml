name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [Master]
  # Tags do not trigger CI (it listens on branches only), so a tag build starts
  # here directly.  A release tag is expected to point at a commit that already
  # passed CI on Master.
  push:
    tags: ["v*"]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: fgeeha
  IMAGE_NAME: roop
  # GitHub Packages rejects uppercase image names and the repository is
  # "Fgeeha/ROoP", so the path is spelled out instead of using github.repository.
  GHCR_IMAGE: ghcr.io/fgeeha/roop

jobs:
  # ----------------------------------------------------------
  # Build & push Docker image to Docker Hub and GitHub Packages
  # ----------------------------------------------------------
  build-and-push:
    name: Build & Push
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GitHub Packages
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # One build, both registries: every tag below is produced for each image.
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./rag_ollama
          file: ./rag_ollama/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ----------------------------------------------------------
  # Trivy security scan
  # ----------------------------------------------------------
  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'

    steps:
      # Needed for .trivyignore.yaml — the scan itself pulls the published image.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

  # ----------------------------------------------------------
  # GitHub Release — tag pushes only, after the image is built and scanned
  # ----------------------------------------------------------
  release:
    name: GitHub Release
    needs: [build-and-push, trivy-scan]
    runs-on: ubuntu-latest
    # Trivy stays in `needs` so the scan still runs and reports on a tag, but
    # its verdict does not gate the release: the image is pushed by the time
    # the scan runs, and an image published without a matching release entry
    # is worse than a release carrying a known finding.
    if: >-
      always()
      && needs.build-and-push.result == 'success'
      && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo '### Docker images'
            echo
            echo '```bash'
            echo "docker pull ${DOCKERHUB_NAMESPACE}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
            echo "docker pull ${GHCR_IMAGE}:${GITHUB_REF_NAME}"
            echo '```'
            echo
            # Notes are generated through the API rather than by
            # `gh release create --generate-notes` so that the image block
            # stays above the commit list.
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" --jq .body
          } > release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag such as v1.2.0-rc1 is published as a pre-release.
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            ${prerelease}

  # ----------------------------------------------------------
  # Telegram notification (optional)
  # ----------------------------------------------------------
  notify:
    name: Telegram notify
    needs: [build-and-push, trivy-scan]
    runs-on: ubuntu-latest
    if: success() && vars.TELEGRAM_ENABLED == 'true'

    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Docker image pushed successfully
            Docker Hub: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            GitHub Packages: ${{ env.GHCR_IMAGE }}:latest
            Trivy scan: PASSED
            Repo: ${{ github.repository }}
            Ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
            SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha || github.sha }}
