name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [Master]

concurrency:
  group: cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: fgeeha
  IMAGE_NAME: roop

jobs:
  # ----------------------------------------------------------
  # Build & push Docker image to Docker Hub
  # ----------------------------------------------------------
  build-and-push:
    name: Build & Push to Docker Hub
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./rag_ollama
          file: ./rag_ollama/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ----------------------------------------------------------
  # Trivy security scan
  # ----------------------------------------------------------
  trivy-scan:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Scan image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

  # ----------------------------------------------------------
  # Telegram notification (optional)
  # ----------------------------------------------------------
  notify:
    name: Telegram notify
    needs: [build-and-push, trivy-scan]
    runs-on: ubuntu-latest
    if: success() && vars.TELEGRAM_ENABLED == 'true'

    steps:
      - name: Send Telegram message
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Docker image pushed successfully
            Image: ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            Trivy scan: PASSED
            Repo: ${{ github.repository }}
            Branch: ${{ github.event.workflow_run.head_branch }}
            SHA: ${{ github.event.workflow_run.head_sha }}
            Commit: https://github.com/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
